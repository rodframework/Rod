[package]
name = "rod-module-runkeys"
version = "1.0.0"
edition = "2021"

# The persistence family's first module (architecture.md Sec 5.4):
# persist.runkeys, the registry Run key seat under HKCU or HKLM --
# installed, removed, and listed from one verb, so the install always
# carries its removal (todo.md's pairing rule for the family). The
# Windows half speaks advapi32 directly: a module owes the loader no
# dependency for six registry calls. Built as a cdylib for Windows
# targets and delivered as a module.load task's content.

[lib]
# rlib beside cdylib so the bin target below links the same plugin code;
# cargo emits the rlib for internal use only, the cdylib is the artifact.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rod-module-runkeys"
path = "src/main.rs"

[dependencies]
rod-plugin-sdk = { path = "../../plugin-sdk" }
