[package]
name = "rod-module-wmi"
version = "1.0.0"
edition = "2021"

# The persistence family's third module (architecture.md Sec 5.4):
# persist.wmi, the WMI event subscription seat -- the bound triple in
# the repository under ROOT\SUBSCRIPTION (event filter, command-line
# consumer, binding), installed, removed, and listed from one verb, so
# the install always carries its removal (todo.md's pairing rule for
# the family). The Windows half speaks the WMI COM edge directly --
# ole32, oleaut32, and the four interfaces the triple needs -- a
# module owes the loader no dependency for any of it. Built as a cdylib
# for Windows targets and delivered as a module.load task's content.

[lib]
# rlib beside cdylib so the bin target below links the same plugin code;
# cargo emits the rlib for internal use only, the cdylib is the artifact.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rod-module-wmi"
path = "src/main.rs"

[dependencies]
rod-plugin-sdk = { path = "../../plugin-sdk" }
