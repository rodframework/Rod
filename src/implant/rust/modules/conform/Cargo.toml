[package]
name = "rod-module-conform"
version = "1.0.0"
edition = "2021"

# The conformance fixture plugin (extending/implants.md, Tier 2): the
# exec-v1 module the harness stages through module.load to prove a
# candidate hosts the loader family -- one verb answering a marker, and
# one artifact run exercising the ABI 2 return. Benign by construction;
# it names the clause it serves.

[lib]
# rlib beside cdylib so the bin target below links the same plugin code.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rod-module-conform"
path = "src/main.rs"

[dependencies]
rod-plugin-sdk = { path = "../../plugin-sdk" }
