[package]
name = "rod-module-hijack"
version = "1.0.0"
edition = "2021"

# The persistence family's last module (architecture.md Sec 5.4):
# persist.hijack, the DLL search-order seat -- a DLL planted beside a
# host binary the loader reads before System32, installed from a file
# the operator already pushed, removed by deleting it, and listed as
# the host binary's open slots. The install validates the slot before
# writing a file (the binary imports the DLL, it sits outside
# KnownDLLs, the seat is vacant): the module does not drop a file onto
# a seat it has not proved the loader will use. The Windows half
# speaks kernel32 and advapi32 directly -- a module owes the loader no
# dependency for any of it. Built as a cdylib for Windows targets and
# delivered as a module.load task's content.

[lib]
# rlib beside cdylib so the bin target below links the same plugin code;
# cargo emits the rlib for internal use only, the cdylib is the artifact.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rod-module-hijack"
path = "src/main.rs"

[dependencies]
rod-plugin-sdk = { path = "../../plugin-sdk" }
