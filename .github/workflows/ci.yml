name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The nightly full-lane pass: every lane runs, extended included, so the
    # non-blocking lane still gets a scheduled verdict.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    # Pinned: the ubuntu-latest label migrates to Ubuntu 26 in October 2026,
    # and an unpinned label lets a runner image change the toolchain under us.
    runs-on: ubuntu-24.04
    env:
      # The blocking lane: every suite that neither runs the real Rust
      # implant as a process nor drives the conformance harness. The
      # classes excluded here are the ones that do; they are the
      # implant-toolchain lane below, non-blocking by design. The core lane
      # still compiles through cargo -- the listener, stager-token, and
      # audit suites build real artifacts as part of their flows -- so the
      # Rust toolchain below must be complete, and the shared target dir
      # keeps those compiles incremental after the first. Module test
      # projects used to be excluded here too; they left with their
      # modules (ADR-024) and now run in modules.yml out of the module
      # repositories, on demand -- the main lane's time does not grow
      # linearly with the module set.
      CORE_FILTER: >-
        FullyQualifiedName!~Rod.Conformance.Tests
        &FullyQualifiedName!~RustImplantEndToEndTests
        &FullyQualifiedName!~PayloadBuildTests
        &FullyQualifiedName!~PayloadJobTests
        &FullyQualifiedName!~PayloadTransformChainTests
      # The implant-toolchain lane: the complement of the core lane. It
      # compiles the real Rust implant via cargo and proves it against a live
      # teamserver, which needs the toolchain warm and the runner to itself --
      # under cargo's target-dir lock those tests time out when run beside a
      # full parallel suite, so they get their own lane, serialized.
      EXTENDED_FILTER: >-
        FullyQualifiedName~Rod.Conformance.Tests
        |FullyQualifiedName~RustImplantEndToEndTests
        |FullyQualifiedName~GoImplantEndToEndTests
        |FullyQualifiedName~PayloadBuildTests
        |FullyQualifiedName~PayloadJobTests
        |FullyQualifiedName~PayloadTransformChainTests
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        # Version comes from global.json (pinned to 10.0.110).
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Pinned like global.json pins the SDK: Vite 8 needs >=20.19 or
          # >=22.12, and an unpinned lts/* lets a runner image change the
          # toolchain under us.
          node-version: 24
          cache: npm
          cache-dependency-path: src/teamserver/Rod.TeamServer/Client/package-lock.json
      - name: Setup Go
        # The Go build unit's legs need it: the implant-toolchain lane
        # builds and runs the Go implant, and the build tests' real-build
        # arm compiles through the unit when the toolchain is present
        # (self-skipping otherwise). Pinned like every toolchain here; the
        # module's go directive (1.25) stays behind the pinned toolchain.
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          # The module cache setup-go keys on go.sum is dead weight here:
          # the Go unit vendors its dependencies, so no build consults the
          # module cache and the runner-root go.sum probe only warns.
          cache: false
      - name: Build operator UI
        # Emits the React bundle into src/teamserver/Rod.TeamServer/wwwroot so
        # the .NET build packages it. The output is gitignored. The test run
        # covers the UI's contract halves (the schema-driven form builder,
        # the output-taxonomy parsers) -- the acceptance legs that keep a
        # novel module's UI interaction framework-free.
        working-directory: src/teamserver/Rod.TeamServer/Client
        run: |
          npm ci
          npm run build
          npm test
      - name: Restore
        run: dotnet restore Rod.slnx
      - name: Build
        run: dotnet build Rod.slnx --configuration Release --no-restore
      - name: Install the Rust build toolchain
        # The payload pipeline compiles the reference implant through cargo on
        # request, and the reference shape for linux/amd64 is the static musl
        # cross. A runner without the musl target and the musl C tools fails
        # every build in seconds -- three suite-level build tests went red
        # this way for two days while the runner image's Rust rolled forward
        # under an unchanged tree. prost-build also needs a system protoc.
        # The windows-gnu pair and the aarch64 musl std serve the cross-build
        # regression tests (the exe-name fix and the rust-lld loader link);
        # mingw-w64 carries both windows linkers.
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler musl-tools mingw-w64
          rustup target add x86_64-unknown-linux-musl x86_64-pc-windows-gnu i686-pc-windows-gnu aarch64-unknown-linux-musl
          echo "ROD_RUST_TARGET_DIR=${RUNNER_TEMP}/rod-rust-target" >> "$GITHUB_ENV"
      - name: Cache the pinned implant sources
        # The implant trees live in their own repositories now; the lock at
        # the root pins the releases every lane builds against. Exact key on
        # the lock alone -- a different pin is different content, and the
        # fetch step below fills a miss.
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/rod-implant-cache
          key: implant-src-${{ hashFiles('rod-implants.lock.json') }}
      - name: Fetch the pinned implant sources
        # The build units and the implant-toolchain lane resolve their
        # source trees through the pinned lock (architecture.md Sec 15.4);
        # materializing the cache up front means no test pays the fetch,
        # and the warm cache turns the units' resolution into a no-op.
        # Same contract the resolver holds: fetch with retries, verify the
        # sha256, unpack under <cache>/<language>/<version>.
        run: |
          rust_repo="$(jq -r .rust.repository rod-implants.lock.json)"
          rust_version="$(jq -r .rust.version rod-implants.lock.json)"
          rust_sha256="$(jq -r .rust.sha256 rod-implants.lock.json)"
          go_repo="$(jq -r .go.repository rod-implants.lock.json)"
          go_version="$(jq -r .go.version rod-implants.lock.json)"
          go_sha256="$(jq -r .go.sha256 rod-implants.lock.json)"
          fetch_pinned() {
            repo="$1"; ver="$2"; sha="$3"; lang="$4"
            name="rod-implant-${lang}-src-${ver}.tar.gz"
            dir="${ROD_IMPLANT_CACHE}/${lang}/${ver}"
            if [ -d "$dir/src/implant/$lang" ]; then echo "$name: warm"; return; fi
            for attempt in 1 2 3 4 5; do
              curl -fsSL "${repo}/releases/download/${ver}/${name}" -o "$name" && break
              sleep "$((attempt * attempt))"
            done
            test -s "$name"
            echo "${sha}  ${name}" | sha256sum -c -
            mkdir -p "$dir"
            tar -xzf "$name" -C "$dir"
            rm -f "$name"
          }
          fetch_pinned "$rust_repo" "$rust_version" "$rust_sha256" rust
          fetch_pinned "$go_repo" "$go_version" "$go_sha256" go
          # The proto sibling the resolver's C# half copies beside a cached
          # Rust tree: direct cargo runs there (the warm-up below, and any
          # bash-side build) resolve the wire contract through build.rs's
          # ../../teamserver probe, so the sibling must pre-exist.
          mkdir -p "${ROD_IMPLANT_CACHE}/rust/${rust_version}/src/teamserver/Rod.Protocol/protos"
          cp src/teamserver/Rod.Protocol/protos/rod.proto \
            "${ROD_IMPLANT_CACHE}/rust/${rust_version}/src/teamserver/Rod.Protocol/protos/"
          echo "ROD_IMPLANT_CACHE=${ROD_IMPLANT_CACHE}" >> "$GITHUB_ENV"
          echo "ROD_IMPLANT_RUST_TREE=${ROD_IMPLANT_CACHE}/rust/${rust_version}/src/implant/rust" >> "$GITHUB_ENV"
        env:
          ROD_IMPLANT_CACHE: ${{ runner.temp }}/rod-implant-cache
      - name: Cache the shared Rust target dir
        # The warm-up below compiles the same three crosses in both feature
        # configurations on every run; with the target dir cached they land
        # as incremental no-ops, and the core lane's in-test cargo builds
        # start warm too. Keyed on the implant lock -- the pinned Cargo.lock
        # rides inside it, so a pin bump is a dependency bump, and a
        # toolchain roll invalidates inside cargo's fingerprints, not the
        # key.
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/rod-rust-target
          key: rust-targets-${{ hashFiles('rod-implants.lock.json') }}
          restore-keys: rust-targets-
      - name: Warm the shared Rust target dir
        # One full compile per exercised target up front, outside any test,
        # so no single test pays the cold-build minutes (a cold mingw build
        # inside one test brushes the five-minute blame-hang budget) and the
        # per-build staging copies only recompile the implant crate itself.
        # The aarch64 loader is small enough to build cold in its test. Runs
        # serially here, so the shared dir never contends on cargo's lock.
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --manifest-path "$ROD_IMPLANT_RUST_TREE/Cargo.toml"
          cargo build --release --target x86_64-pc-windows-gnu --manifest-path "$ROD_IMPLANT_RUST_TREE/Cargo.toml"
          cargo build --release --target i686-pc-windows-gnu --manifest-path "$ROD_IMPLANT_RUST_TREE/Cargo.toml"
      - name: Build the three-target matrix's WireGuard profiles
        # The optional transport's cross-matrix proof (Sec 15.3 ADR-004 as
        # amended, the item's acceptance): the same three crosses, each with
        # the wireguard feature -- boringtun compiles clean on every target
        # the implant ships as. The warm dir above keeps these incremental.
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --features wireguard --manifest-path "$ROD_IMPLANT_RUST_TREE/Cargo.toml"
          cargo build --release --target x86_64-pc-windows-gnu --features wireguard --manifest-path "$ROD_IMPLANT_RUST_TREE/Cargo.toml"
          cargo build --release --target i686-pc-windows-gnu --features wireguard --manifest-path "$ROD_IMPLANT_RUST_TREE/Cargo.toml"
      - name: Build the native WireGuard router
        # The wireguard suites P/Invoke the rod_wg cdylib (its resolver walks
        # up to the repo's own target/release), and a missing library is a
        # failed test, not a skipped one -- the transport's tests exist to
        # prove the seam, so CI builds the library before any dotnet test
        # runs. The test-client feature is the test suites' export set; a
        # release build never carries it.
        run: cargo build --release --features test-client --manifest-path src/native/wireguard/Cargo.toml
      - name: Test (core lane)
        id: test_core
        # Blame-hang turns a silent hang into a five-minute failure that dumps
        # the stuck test host and names the test it was running. The suite has
        # hung without progress three times before (Aug 18, 19, and Sep 1,
        # cancelled at the six-hour budget) -- without this, a hung host just
        # burns the runner until someone cancels by hand.
        # ci.runsettings caps assembly parallelism (see the file for why).
        # Full dumps (not mini) so `dotnet-dump analyze -c dumpasync` can name
        # the suspended state machine on the CI side the way the local repro
        # did: a hung beacon read is invisible to thread stacks.
        # The trx log is what the targeted retry below reads: the first
        # attempt's failures decide what the retry runs.
        continue-on-error: true
        run: >-
          dotnet test Rod.slnx --configuration Release --no-build --settings ci.runsettings
          --filter "$CORE_FILTER"
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type full
          --logger trx
      - name: Collect the core lane's failures
        # The targeted retry's input: the failed tests' names out of the first
        # attempt's trx logs, as a dotnet-test filter.
        if: steps.test_core.outcome == 'failure'
        run: python3 scripts/ci/collect-trx-failures.py CORE_RETRY_FILTER
      - name: Test (core lane, retry the failures)
        # The retry is targeted, not whole-suite: one-off flakes under a
        # constrained runner are absorbed, and the job stays red only when the
        # SAME test fails twice in a row -- a real regression. The sentinel
        # keeps the whole-suite fallback for the hang class with no parseable
        # results.
        if: steps.test_core.outcome == 'failure'
        run: |
          if [ "$CORE_RETRY_FILTER" = "__all__" ]; then
            dotnet test Rod.slnx --configuration Release --no-build --settings ci.runsettings --filter "$CORE_FILTER" --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type full
          else
            dotnet test Rod.slnx --configuration Release --no-build --settings ci.runsettings --filter "$CORE_RETRY_FILTER" --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type full
          fi
      - name: Test (implant-toolchain lane)
        # Skipped on push: the lane's minutes buy an advisory verdict the
        # nightly schedule re-derives anyway, and a push's blocking signal
        # is the core lane above. Where it does run it stays non-blocking:
        # this lane carries the environment-sensitive family -- cargo
        # compiles, real implant processes, and the conformance harness
        # against a live teamserver -- whose failures are worth triage
        # without being worth a red run. PR runs keep it (a verdict before
        # main), and the nightly schedule gives the standing verdict.
        if: github.event_name != 'push'
        id: test_extended
        continue-on-error: true
        run: >-
          dotnet test Rod.slnx --configuration Release --no-build --settings ci.runsettings
          --filter "$EXTENDED_FILTER"
          --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full
          --logger trx
      - name: Collect the implant-toolchain lane's failures
        # A GITHUB_ENV write only reaches later steps, so collecting inside the
        # retry step would leave the filter empty and run the whole lane.
        if: steps.test_extended.outcome == 'failure'
        run: python3 scripts/ci/collect-trx-failures.py EXTENDED_RETRY_FILTER
      - name: Test (implant-toolchain lane, retry the failures)
        # The same targeted retry the core lane uses, kept non-blocking.
        if: steps.test_extended.outcome == 'failure'
        continue-on-error: true
        run: |
          if [ "$EXTENDED_RETRY_FILTER" = "__all__" ]; then
            dotnet test Rod.slnx --configuration Release --no-build --settings ci.runsettings --filter "$EXTENDED_FILTER" --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full
          else
            dotnet test Rod.slnx --configuration Release --no-build --settings ci.runsettings --filter "$EXTENDED_RETRY_FILTER" --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full
          fi
      - name: Upload test diagnostics
        # The blame collector writes the hang dump and the test sequence (its
        # last entry names the hung test) under TestResults; they only survive
        # the runner if they are uploaded before the job tears down.
        if: steps.test_core.outcome == 'failure' || steps.test_extended.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics
          path: '**/TestResults/**'
          if-no-files-found: ignore

  format:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
      - name: Verify formatting
        run: dotnet format Rod.slnx --verify-no-changes

  dotnet-redirector:
    name: .NET redirector (Native AOT)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        # Native AOT publish uses the SDK pinned by global.json and the platform
        # link-time toolchain the ubuntu-24.04 runner provides.
        uses: actions/setup-dotnet@v5
      - name: Install Native AOT link prerequisites
        # .NET Native AOT link-time analysis needs zlib on the build host; the
        # runner carries clang already. zlib1g-dev is a documented Native AOT
        # dependency on Debian/Ubuntu.
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Publish Native AOT forwarder
        # The redirector is a .NET Native AOT forwarder (ADR 0009/0011): a single
        # static binary with no runtime install. PublishAot is set in the csproj,
        # so this produces a native rod-redirector binary on the runner -- the
        # real proof the AOT property holds end to end. Normal build, test, and
        # format of the project are already covered by the build-and-test and
        # format jobs above (it ships in Rod.slnx).
        run: dotnet publish src/redirector/Rod.Redirector.csproj -r linux-x64 -c Release
      - name: Verify single binary
        run: |
          set -e
          bin="$(find src/redirector/bin/Release/net10.0/linux-x64/publish -maxdepth 1 -name rod-redirector -type f)"
          test -n "$bin"
          test -x "$bin"
          ls -lh "$bin"

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan full history with gitleaks
        # Run the MIT-licensed gitleaks CLI directly rather than the
        # gitleaks-action wrapper, which requires a paid license key since v2.
        # Same scan the action ran: every commit in history, fail on any finding.
        # Pin the version explicitly so an upstream release cannot silently
        # change results.
        env:
          GITLEAKS_VERSION: "8.27.1"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --verbose
