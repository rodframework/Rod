name: release

on:
  push:
    tags: ['v*']

# The release job creates the GitHub release and attaches its assets.
permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release
    # Pinned for the same reason ci.yml pins: an unpinned label lets a runner
    # image change the toolchain under us.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify the tag matches RodVersion
        # Directory.Build.props is the single source of truth for the version:
        # a release tag is v<RodVersion> cut from the tree that carries the
        # bare version (the -dev suffix drops in the same change that cuts
        # the tag). A mismatched tag ships a binary whose BuildStamp claims a
        # version the tag does not name.
        run: |
          version="$(sed -n 's/.*<RodVersion>\(.*\)<\/RodVersion>.*/\1/p' Directory.Build.props | head -1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match RodVersion ${version} in Directory.Build.props" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        # Version comes from global.json (pinned to 10.0.110).
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/teamserver/Rod.TeamServer/Client/package-lock.json
      - name: Build operator UI
        working-directory: src/teamserver/Rod.TeamServer/Client
        run: |
          npm ci
          npm run build
      - name: Publish the self-contained teamserver
        # The install shape teamserver.md documents: a self-contained publish
        # carrying its own runtime, so the deploy host installs neither SDK
        # nor runtime. The runner is the only machine the artifact ever
        # touches -- no developer host's paths, toolchains, or state reach
        # the release (the repo's gitleaks gate covers the source side).
        run: |
          dotnet publish src/teamserver/Rod.TeamServer/Rod.TeamServer.csproj \
            -c Release -r linux-x64 --self-contained true -o dist/teamserver
      - name: Build the native WireGuard router
        # The optional transport's deployment shape: the cdylib ships beside
        # the server binary (the P/Invoke resolver's second lookup), built
        # from its default feature set -- the test-client exports the CI
        # suites drive never ride a release artifact. The library is inert
        # unless a deployment sets WireGuard:Enabled, so shipping it costs
        # bytes, not posture.
        run: |
          cargo build --release --manifest-path src/native/wireguard/Cargo.toml
          cp src/native/wireguard/target/release/librod_wg.so dist/teamserver/
          tar -czf dist/rod-teamserver-linux-x64.tar.gz -C dist/teamserver .
      - name: Pack the payload build source
        # The minimal deployed tree teamserver.md names -- the implant
        # crates and the wire protos. The Rust tree carries crates.io
        # dependencies vendored beside it (RustBuildUnit compiles the
        # crate only; plugin-sdk and modules are not part of the deployed
        # build); the Go module vendors in-tree, so it rides as-is. The
        # tar's version is tied to the binary's by the release tag both
        # were cut from, and the vendor dirs mean the deploy host needs no
        # registry egress for payload builds.
        run: |
          (cd src/implant/rust && cargo vendor vendor > /tmp/vendor-config.toml)
          mkdir -p src/implant/rust/.cargo
          {
            echo '# Written by the release workflow: pin the build to the vendored'
            echo '# crates so payload builds need no registry egress.'
            cat /tmp/vendor-config.toml
          } > src/implant/rust/.cargo/config.toml
          tar -czf dist/rod-src.tar.gz \
            --exclude 'target' \
            src/implant/rust src/implant/go src/teamserver/Rod.Protocol/protos
      - name: Build the operator CLI
        # rod mod coverage (below) renders the release's ATT&CK section from
        # the module manifests and the kernel catalog -- the advancement
        # mechanism's promise: the notes' coverage claims are generated from
        # the declarations, never hand-written.
        run: dotnet publish src/cli/dotnet/Rod.Cli.csproj -c Release -o dist/cli
      - name: Compose the release notes
        # GitHub's generated changelog, then the coverage matrix appended as
        # its own section -- the generated markdown's heading is the section
        # heading. gh api fills {owner}/{repo} from the checkout's origin.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/{owner}/{repo}/releases/generate-notes \
            -f tag_name="$GITHUB_REF_NAME" \
            -f target_commitish="$GITHUB_SHA" \
            -q .body > dist/release-notes.md
          printf '\n' >> dist/release-notes.md
          dist/cli/rod mod coverage \
            --path modules \
            --catalog src/teamserver/Rod.CoreState/Implants/attack-coverage.json \
            >> dist/release-notes.md
      - name: Create the release
        # gh is first-party and preinstalled on the runner; the token is the
        # job's own, scoped by the permissions block above. A suffixed
        # RodVersion (dev, rc) marks the release a prerelease, so GitHub's
        # "latest" -- and install.sh's latest/download redirect -- stay
        # reserved for the bare-version release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "Rod ${GITHUB_REF_NAME#v}" \
            --notes-file dist/release-notes.md \
            "${flags[@]}" \
            dist/rod-teamserver-linux-x64.tar.gz dist/rod-src.tar.gz scripts/install.sh
