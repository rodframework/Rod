name: modules

# The module lane, on demand: module content tests travel with the module
# (architecture.md Sec 15.1 -- under modules/<name>/tests/), so their cost
# belongs to the trees that carry them, not to every push. The server-side
# halves under modules/ are pure descriptor manifests (ADR-018) -- no
# assembly to build -- so the lane's build verdict is the CLI's own manifest
# validation (parse plus the closed-vocabulary checks `rod mod coverage`
# runs) over every manifest by shape; the kernel suites hold the loading
# acceptance (the in-tree modules load through the config-listed path).
# Asset-module test projects (the content half's .NET trees) run only here,
# when a module tree or the shared build settings they compile under
# change. The nightly schedule keeps a standing verdict, the same
# discipline ci.yml's extended lane and the implant matrix carry; ci.yml's
# core lane excludes the Rod.Modules.* tests to match.

on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/modules.yml'
  pull_request:
    branches: [main]
    paths:
      - 'modules/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/modules.yml'
  schedule:
    # Between ci.yml's 03:00 full-lane pass and the 05:00 implant matrix, so
    # the three scheduled verdicts land in order.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-tests:
    name: Validate and test the modules
    # Pinned like every runner here (ci.yml's rationale): an unpinned label
    # lets a runner image change the toolchain under an unchanged tree.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        # Version comes from global.json (pinned to 10.0.110).
      - name: Validate the module manifests
        # Every manifest under modules/ through the CLI's own loader: parse
        # plus validation, the same gate `rod mod publish` holds -- a broken
        # descriptor row fails the lane before any kernel suite runs.
        # Discovery by shape, not by list: a new module joins the lane by
        # carrying its rod-module.toml, no workflow edit.
        run: |
          shopt -s nullglob
          manifests=(modules/*/rod-module.toml)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "no module manifests"
            exit 0
          fi
          dotnet build src/cli/dotnet/Rod.Cli.csproj --configuration Release
          for manifest in "${manifests[@]}"; do
            directory=$(dirname "$manifest")
            dotnet run --project src/cli/dotnet --no-build --configuration Release -- \
              mod coverage --path "$directory"
          done
      - name: Run the module test projects
        # Discovery by shape, not by list: a new module's tests join the lane
        # by existing under modules/<name>/tests/, no workflow edit -- the
        # same zero-touch rule the kernel suites hold.
        run: |
          shopt -s nullglob
          projects=(modules/*/tests/*.csproj)
          if [ ${#projects[@]} -eq 0 ]; then
            echo "no module test projects"
            exit 0
          fi
          for project in "${projects[@]}"; do
            dotnet test "$project" --configuration Release
          done
