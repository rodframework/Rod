# The lsasecrets module's v4 plugin package (architecture.md Sec 15.2,
# ADR-020): the credential collection family's fourth entry rides the
# same package format, canonical form, and signature chain an external
# module rides, exercised by the CLI's end-to-end tests exactly like a
# template-repository module. The package carries the server-side
# descriptor rows and the Linux exec-shape artifact an implant loads
# through module.load -- build.sh puts the binary at plugin/ before `rod
# mod publish` packs it.

[module]
name = "lsasecrets"
version = "1.1.0"
entry = "plugin"
license = "Apache-2.0"
description = "LSA secrets: survey the policy's secret store and read its values in place -- the inventory enumerated out of the registry's SECURITY subtree, the values asked back through the LSA's policy API (the system performs its own decryption), nothing landing on disk -- collect.lsasecrets's execution half packed as the artifact an implant loads through module.load."

[compatibility]
teamserver = "1.0.0"

# A plugin's requirement rows are exactly its artifacts' ABI union
# (ADR-020): the Linux artifact is the exec shape, so the hosting implant
# must advertise that loader. The implant's handshake advertisement is the
# runtime truth; this row is the store's static filter.
requires = ["plugin-loader/exec-v1"]

# The verb version matrix (architecture.md Sec 15.2), now the descriptor
# row itself (ADR-018): the verb iterates
# under its own module-scoped version, independently of the package
# version. The row's techniques are the authoritative per-verb ATT&CK
# declaration (ADR-007) -- the ids the descriptor row itself declares
# -- with the module-level [attack] list as their validated
# roll-up. T1003.004 (OS Credential Dumping: LSA Secrets) is the
# in-place read itself; the kernel catalog carries the T1003 parent
# under collect.cred and the matrix renders this sub-technique by id
# beside it, the same way the hives row renders.
# The row is unchanged from the 1.0.0 descriptor-only package; 1.1.0 is
# the tier change that packs the artifact beside it.
[[verbs]]
name = "collect.lsasecrets"
version = "1.0.0"
category = "collect"
opsec = { "reads-credential" = true }
techniques = ["T1003.004"]
output-kind = "text"
output-help = "The seat row and the store's names on list, or one row per secret on read -- the value as text where the bytes decode cleanly, as hex where they do not."

  [[verbs.parameters]]
  name = "action"
  label = "Action"
  kind = "enum"
  help = "Empty reports the survey -- a bare task is a read. The value read needs a SYSTEM implant."
  choices = ["list", "read"]

  [[verbs.parameters]]
  name = "name"
  label = "Secret name"
  kind = "text"
  help = "The one secret read narrows to; absent reads the whole store. Read only."
  placeholder = "$MACHINE.ACC"
  trailing = true

# The one target the artifact set covers: one prebuilt execution half per
# platform and arch the package ships. A Windows artifact row joins when
# a release builds one -- a target without its artifact is a claim the
# package does not carry.
[[compatibility.targets]]
implant-class = "implant"
platform = "linux"
arch = "amd64"

[opsec]
lands-on-disk = false
notes = "Server side, the package lands as descriptor rows and one artifact file under the module store -- no code runs in the teamserver. On the target, the implant half loads from staged task content and nothing it does lands on disk: the subtree and the values are read where they sit, in the implant process's own LSA session, and the rows ride the task's channel back. Both halves of the act answer to the SYSTEM seat -- the subtree that enumerates the names answers SYSTEM alone, and so do the secret objects the policy API queries -- so an implant that is merely elevated refuses once, named. The values are the store's own secrets (service-account passwords, the auto-logon password, the DPAPI machine keys, the machine-account password) in plain reach of the audit log the rows enter. The verb rides the per-engagement module load -- never a default profile."

[attack]
techniques = ["T1003.004"]

# The artifact is build output -- build.sh copies the cargo binary into
# plugin/ before a publish; nothing there is committed. The rules admit
# the manifest and the plugin directory only, so the tree's build script
# never rides the package.
[package]
include = ["rod-module.toml", "plugin/**"]

[[plugin.artifacts]]
platform = "linux"
arch = "amd64"
path = "plugin/lsasecrets-linux-amd64"
abi = "exec-v1"
