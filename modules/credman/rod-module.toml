# The credman module's v4 plugin package (architecture.md Sec 15.2,
# ADR-020): the credential collection family's fifth entry rides the
# same package format, canonical form, and signature chain an external
# module rides, exercised by the CLI's end-to-end tests exactly like a
# template-repository module. The package carries the server-side
# descriptor rows and the Linux exec-shape artifact an implant loads
# through module.load -- build.sh puts the binary at plugin/ before `rod
# mod publish` packs it.

[module]
name = "credman"
version = "1.1.0"
entry = "plugin"
license = "Apache-2.0"
description = "Windows credential manager: survey the calling logon session's store and read its entries in place -- the inventory enumerated through the credential API (the system performs its own decryption), the generic entries' material returned as the credential rows the credentials board parses, nothing landing on disk -- collect.credman's execution half packed as the artifact an implant loads through module.load."

[compatibility]
teamserver = "1.0.0"

# A plugin's requirement rows are exactly its artifacts' ABI union
# (ADR-020): the Linux artifact is the exec shape, so the hosting implant
# must advertise that loader. The implant's handshake advertisement is the
# runtime truth; this row is the store's static filter.
requires = ["plugin-loader/exec-v1"]

# The verb version matrix (architecture.md Sec 15.2), now the descriptor
# row itself (ADR-018): the verb iterates
# under its own module-scoped version, independently of the package
# version. The row's techniques are the authoritative per-verb ATT&CK
# declaration (ADR-007) -- the ids the descriptor row itself declares
# -- with the module-level [attack] list as their validated
# roll-up. T1555.004 (Credentials from Password Stores: Windows
# Credential Manager) is the in-place store read itself; the kernel
# catalog carries the T1555 parent under collect.cred and the matrix
# renders this sub-technique by id beside it, the same way the
# lsasecrets row renders.
# The row is unchanged from the 1.0.0 descriptor-only package; 1.1.0 is
# the tier change that packs the artifact beside it.
[[verbs]]
name = "collect.credman"
version = "1.0.0"
category = "collect"
opsec = { "reads-credential" = true }
techniques = ["T1555.004"]
output-kind = "credential"
output-help = "One credential row per line: the entry's kind, principal, source, and note (target, type, persistence, last write); the read adds the secret where the store handed its blob back -- the credentials board parses every row and masks the secret until revealed."

  [[verbs.parameters]]
  name = "action"
  label = "Action"
  kind = "enum"
  help = "Empty reports the survey -- a bare task is a read. The read reaches the calling session's own store; no privilege asked."
  choices = ["list", "read"]

  [[verbs.parameters]]
  name = "target"
  label = "Target name"
  kind = "text"
  help = "The one entry read narrows to, matched against the entry's target name; absent reads the whole store. Read only."
  placeholder = "TERMSRV/web01.corp.example"
  trailing = true

# The one target the artifact set covers: one prebuilt execution half per
# platform and arch the package ships. A Windows artifact row joins when
# a release builds one -- a target without its artifact is a claim the
# package does not carry.
[[compatibility.targets]]
implant-class = "implant"
platform = "linux"
arch = "amd64"

[opsec]
lands-on-disk = false
notes = "Server side, the package lands as descriptor rows and one artifact file under the module store -- no code runs in the teamserver. On the target, the implant half loads from staged task content and nothing it does lands on disk: the store is enumerated through the credential API in the implant process's own logon session and the rows ride the task's channel back. The store the verb reaches is the session's own -- no privilege asked, no seat implied: an implant running as the desktop user reads that user's saved entries (generic passwords above all), while the domain-credential types the system hands back without their blobs render as the withholding they are. The credential rows' secret field renders masked in the credentials board and never enters the audit chain; everything else the rows carry reaches the audit log every dispatched action already enters. The verb rides the per-engagement module load -- never a default profile."

[attack]
techniques = ["T1555.004"]

# The artifact is build output -- build.sh copies the cargo binary into
# plugin/ before a publish; nothing there is committed. The rules admit
# the manifest and the plugin directory only, so the tree's build script
# never rides the package.
[package]
include = ["rod-module.toml", "plugin/**"]

[[plugin.artifacts]]
platform = "linux"
arch = "amd64"
path = "plugin/credman-linux-amd64"
abi = "exec-v1"
