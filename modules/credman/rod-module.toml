# The credman module manifest (architecture.md Sec 15.2): the
# credential collection family's fifth entry rides the same package
# format, canonical form, and signature chain the modules before it
# ride, exercised by the CLI's end-to-end tests exactly like a
# template-repository module.

[module]
name = "credman"
version = "1.0.0"
entry = "server"
license = "Apache-2.0"
description = "Windows credential manager: survey the calling logon session's store and read its entries in place -- the inventory enumerated through the credential API (the system performs its own decryption), the generic entries' material returned as the credential rows the credentials board parses, nothing landing on disk -- collect.credman's execution half lives at src/implant/rust/modules/credman."

[compatibility]
teamserver = "1.0.0"

# The capability requirements (ADR-017): the pair's execution half is a
# plugin the target loads through the module family, so the hosting implant
# must advertise the loader. The implant's handshake advertisement is the
# runtime truth; this row is the store's static filter.
requires = ["plugin-loader"]

# The verb version matrix (architecture.md Sec 15.2), now the descriptor
# row itself (ADR-018): the verb iterates
# under its own module-scoped version, independently of the package
# version. The row's techniques are the authoritative per-verb ATT&CK
# declaration (ADR-007) -- the ids the descriptor row itself declares
# -- with the module-level [attack] list as their validated
# roll-up. T1555.004 (Credentials from Password Stores: Windows
# Credential Manager) is the in-place store read itself; the kernel
# catalog carries the T1555 parent under collect.cred and the matrix
# renders this sub-technique by id beside it, the same way the
# lsasecrets row renders.
[[verbs]]
name = "collect.credman"
version = "1.0.0"
category = "collect"
opsec = { "reads-credential" = true }
techniques = ["T1555.004"]
output-kind = "credential"
output-help = "One credential row per line: the entry's kind, principal, source, and note (target, type, persistence, last write); the read adds the secret where the store handed its blob back -- the credentials board parses every row and masks the secret until revealed."

  [[verbs.parameters]]
  name = "action"
  label = "Action"
  kind = "enum"
  help = "Empty reports the survey -- a bare task is a read. The read reaches the calling session's own store; no privilege asked."
  choices = ["list", "read"]

  [[verbs.parameters]]
  name = "target"
  label = "Target name"
  kind = "text"
  help = "The one entry read narrows to, matched against the entry's target name; absent reads the whole store. Read only."
  placeholder = "TERMSRV/web01.corp.example"
  trailing = true

# The store exists only on Windows: the manifest claims the two Windows
# targets and no others, so the module loads nowhere the technique has
# nothing to read.
[[compatibility.targets]]
implant-class = "implant"
platform = "windows"
arch = "amd64"

[[compatibility.targets]]
implant-class = "implant"
platform = "windows"
arch = "arm64"

[opsec]
lands-on-disk = false
notes = "The server-side half is this manifest alone -- no code installs on operator infrastructure. On the target, the implant half loads from staged task content and nothing it does lands on disk: the store is enumerated through the credential API in the implant process's own logon session and the rows ride the task's channel back. The store the verb reaches is the session's own -- no privilege asked, no seat implied: an implant running as the desktop user reads that user's saved entries (generic passwords above all), while the domain-credential types the system hands back without their blobs render as the withholding they are. The credential rows' secret field renders masked in the credentials board and never enters the audit chain; everything else the rows carry reaches the audit log every dispatched action already enters. The verb rides the per-engagement module load -- never a default profile."

[attack]
techniques = ["T1555.004"]

[package]
include = ["rod-module.toml"]
