# The avoid module's v4 plugin package (architecture.md Sec 15.2,
# ADR-020): the defense-evasion family's first entry rides the same
# package format, canonical form, and signature chain an external module
# rides, exercised by the CLI's end-to-end tests exactly like a
# template-repository module. The package carries the server-side
# descriptor rows and the Linux exec-shape artifact an implant loads
# through module.load -- build.sh puts the binary at plugin/ before `rod
# mod publish` packs it.

[module]
name = "avoid"
version = "1.1.0"
entry = "plugin"
license = "Apache-2.0"
description = "AMSI and ETW patching: replace the scan and telemetry entry points in this process's memory with failure and silence -- evasion.avoid's execution half packed as the artifact an implant loads through module.load."

[compatibility]
teamserver = "1.0.0"

# A plugin's requirement rows are exactly its artifacts' ABI union
# (ADR-020): the Linux artifact is the exec shape, so the hosting implant
# must advertise that loader. The implant's handshake advertisement is the
# runtime truth; this row is the store's static filter.
requires = ["plugin-loader/exec-v1"]

# The verb version matrix (architecture.md Sec 15.2), now the descriptor
# row itself (ADR-018): the verb iterates
# under its own module-scoped version, independently of the package
# version. The row's techniques are the authoritative per-verb ATT&CK
# declaration (ADR-007) -- the ids the descriptor row itself declares
# -- with the module-level [attack] list as their validated
# roll-up. T1562.001 (Impair Defenses: Disable or Modify Tools) is the
# patch itself; the kernel catalog already carries the id under
# evasion.unload, so this row renders beside a kernel carrier and the
# matrix folds both into the technique's carriers.
# The row is unchanged from the 1.0.0 descriptor-only package; 1.1.0 is
# the tier change that packs the artifact beside it.
[[verbs]]
name = "evasion.avoid"
version = "1.0.0"
category = "evasion"
opsec = { "modifies-defenses" = true }
techniques = ["T1562.001"]
output-kind = "text"
output-help = "One row per patched entry point (the function and what its callers now see), or already-patched rows under a second run."

  [[verbs.parameters]]
  name = "target"
  label = "Target"
  kind = "enum"
  required = true
  help = "What the task patches in this process: amsi, etw, or all."
  choices = ["amsi", "etw", "all"]

# The one target the artifact set covers: one prebuilt execution half per
# platform and arch the package ships. A Windows artifact row joins when
# a release builds one -- a target without its artifact is a claim the
# package does not carry.
[[compatibility.targets]]
implant-class = "implant"
platform = "linux"
arch = "amd64"

[opsec]
lands-on-disk = false
notes = "Server side, the package lands as descriptor rows and one artifact file under the module store -- no code runs in the teamserver. On the target, the implant half loads from staged task content and the patch lands in the process's own memory -- nothing on disk. The scope is exactly that process: the effect dies with it, and a new process loads fresh libraries. AMSI failure telemetry and ETW inline-hook detection are live blue-team surfaces; the verb is sensitive (Evasion category, modifies-defenses attribute), held out of unattended firing by the registry-backed policy, and the plugin rides the per-engagement module load -- never a default profile."

[attack]
techniques = ["T1562.001"]

# The artifact is build output -- build.sh copies the cargo binary into
# plugin/ before a publish; nothing there is committed. The rules admit
# the manifest and the plugin directory only, so the tree's build script
# never rides the package.
[package]
include = ["rod-module.toml", "plugin/**"]

[[plugin.artifacts]]
platform = "linux"
arch = "amd64"
path = "plugin/avoid-linux-amd64"
abi = "exec-v1"
