# The hijack module's v4 plugin package (architecture.md Sec 15.2,
# ADR-020): the persistence family's last entry rides the same package
# format, canonical form, and signature chain an external module rides,
# exercised by the CLI's end-to-end tests exactly like a template-
# repository module. The package carries the server-side descriptor rows
# and the Linux exec-shape artifact an implant loads through module.load
# -- build.sh puts the binary at plugin/ before `rod mod publish` packs
# it.

[module]
name = "hijack"
version = "1.1.0"
entry = "plugin"
license = "Apache-2.0"
description = "DLL search-order seats: install, remove, and list the DLLs planted beside a host binary that the loader reads before System32 -- persist.hijack's execution half packed as the artifact an implant loads through module.load."

[compatibility]
teamserver = "1.0.0"

# A plugin's requirement rows are exactly its artifacts' ABI union
# (ADR-020): the Linux artifact is the exec shape, so the hosting implant
# must advertise that loader. The implant's handshake advertisement is the
# runtime truth; this row is the store's static filter.
requires = ["plugin-loader/exec-v1"]

# The verb version matrix (architecture.md Sec 15.2), now the descriptor
# row itself (ADR-018): the verb iterates
# under its own module-scoped version, independently of the package
# version. The row's techniques are the authoritative per-verb ATT&CK
# declaration (ADR-007) -- the ids the descriptor row itself declares
# -- with the module-level [attack] list as their validated
# roll-up. T1574.001 is the seat itself; the kernel catalog carries no
# T1574 parent (no compiled verb claims it), so the matrix renders this
# row by id alone, the degradation path designed for module-carried
# techniques the kernel never mapped.
# The row is unchanged from the 1.0.0 descriptor-only package; 1.1.0 is
# the tier change that packs the artifact beside it.
[[verbs]]
name = "persist.hijack"
version = "1.0.0"
category = "persist"
opsec = { "writes-to-disk" = true, "persists" = true }
techniques = ["T1574.001"]
output-kind = "text"
output-help = "One row per open slot on list (the DLL and where it stands in the loader's order), or the seat the install planted or the remove deleted."

  [[verbs.parameters]]
  name = "action"
  label = "Action"
  kind = "enum"
  help = "Empty lists the binary's slots -- the read names the binary it inspects."
  choices = ["install", "remove", "list"]

  [[verbs.parameters]]
  name = "binary"
  label = "Host binary"
  kind = "string"
  help = "The host binary as a full path; its directory is the seat the loader reads first."
  placeholder = "C:\\app\\app.exe"

  [[verbs.parameters]]
  name = "dll"
  label = "DLL name"
  kind = "string"
  help = "The imported DLL name the seat claims; for list, a filter narrowing the report to it."
  placeholder = "VERSION.DLL"

  [[verbs.parameters]]
  name = "source"
  label = "Source file"
  kind = "text"
  help = "The already-pushed file to plant; install only."
  trailing = true

# The one target the artifact set covers: one prebuilt execution half per
# platform and arch the package ships. A Windows artifact row joins when
# a release builds one -- a target without its artifact is a claim the
# package does not carry.
[[compatibility.targets]]
implant-class = "implant"
platform = "linux"
arch = "amd64"

[opsec]
lands-on-disk = true
notes = "Server side, the package lands as descriptor rows and one artifact file under the module store -- no code runs in the teamserver. On the target, the implant half loads from staged task content -- the planted DLL itself is the family's first on-disk seat: a plain file in the host binary's directory, hashed by any scanner that walks the file system, loading every time the binary runs while it sits. Nothing in any system ledger names it -- the blue-team side of the footprint is file-system baselining, not service or registry enumeration. Install validates the slot before writing (the binary imports the DLL, it sits outside KnownDLLs, the seat is vacant) and the copy refuses to overwrite what is already there."

[attack]
techniques = ["T1574.001"]

# The artifact is build output -- build.sh copies the cargo binary into
# plugin/ before a publish; nothing there is committed. The rules admit
# the manifest and the plugin directory only, so the tree's build script
# never rides the package.
[package]
include = ["rod-module.toml", "plugin/**"]

[[plugin.artifacts]]
platform = "linux"
arch = "amd64"
path = "plugin/hijack-linux-amd64"
abi = "exec-v1"
