# The hijack module manifest (architecture.md Sec 15.2): the
# persistence family's last entry rides the same package format,
# canonical form, and signature chain hostenum, domainenum, runkeys,
# services, and wmi ride, exercised by the CLI's end-to-end tests
# exactly like a template-repository module.

[module]
name = "hijack"
version = "1.0.0"
entry = "server"
license = "Apache-2.0"
description = "DLL search-order seats: install, remove, and list the DLLs planted beside a host binary that the loader reads before System32 -- persist.hijack's execution half lives at src/implant/rust/modules/hijack."

[compatibility]
teamserver = "1.0.0"

# The capability requirements (ADR-017): the pair's execution half is a
# plugin the target loads through the module family, so the hosting implant
# must advertise the loader. The implant's handshake advertisement is the
# runtime truth; this row is the store's static filter.
requires = ["plugin-loader"]

# The verb version matrix (architecture.md Sec 15.2): the verb iterates
# under its own module-scoped version, independently of the package
# version. The row's techniques are the authoritative per-verb ATT&CK
# declaration (ADR-007) -- the same ids the server-side descriptor
# registers -- with the module-level [attack] list as their validated
# roll-up. T1574.001 is the seat itself; the kernel catalog carries no
# T1574 parent (no compiled verb claims it), so the matrix renders this
# row by id alone, the degradation path designed for module-carried
# techniques the kernel never mapped.
[[verbs]]
name = "persist.hijack"
version = "1.0.0"
techniques = ["T1574.001"]

# The seat exists only on Windows: the manifest claims the two Windows
# targets and no others, so the module loads nowhere the technique has
# nothing to address.
[[compatibility.targets]]
implant-class = "implant"
platform = "windows"
arch = "amd64"

[[compatibility.targets]]
implant-class = "implant"
platform = "windows"
arch = "arm64"

[opsec]
lands-on-disk = true
notes = "Server-side assembly installs on operator infrastructure only. On the target, the implant half loads from staged task content -- the planted DLL itself is the family's first on-disk seat: a plain file in the host binary's directory, hashed by any scanner that walks the file system, loading every time the binary runs while it sits. Nothing in any system ledger names it -- the blue-team side of the footprint is file-system baselining, not service or registry enumeration. Install validates the slot before writing (the binary imports the DLL, it sits outside KnownDLLs, the seat is vacant) and the copy refuses to overwrite what is already there."

[attack]
techniques = ["T1574.001"]

[package]
include = ["rod-module.toml", "*.cs", "*.csproj"]
