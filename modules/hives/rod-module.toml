# The hives module's v4 plugin package (architecture.md Sec 15.2,
# ADR-020): the credential collection family's first entry rides the
# same package format, canonical form, and signature chain an external
# module rides, exercised by the CLI's end-to-end tests exactly like a
# template-repository module. The package carries the server-side
# descriptor rows and the Linux exec-shape artifact an implant loads
# through module.load -- build.sh puts the binary at plugin/ before `rod
# mod publish` packs it.

[module]
name = "hives"
version = "1.1.0"
entry = "plugin"
license = "Apache-2.0"
description = "Account hive dumps: save the SAM, SYSTEM, and SECURITY hives under the backup privilege and report the readiness facts -- collect.hives's execution half packed as the artifact an implant loads through module.load."

[compatibility]
teamserver = "1.0.0"

# A plugin's requirement rows are exactly its artifacts' ABI union
# (ADR-020): the Linux artifact is the exec shape, so the hosting implant
# must advertise that loader. The implant's handshake advertisement is the
# runtime truth; this row is the store's static filter.
requires = ["plugin-loader/exec-v1"]

# The verb version matrix (architecture.md Sec 15.2), now the descriptor
# row itself (ADR-018): the verb iterates
# under its own module-scoped version, independently of the package
# version. The row's techniques are the authoritative per-verb ATT&CK
# declaration (ADR-007) -- the ids the descriptor row itself declares
# -- with the module-level [attack] list as their validated
# roll-up. T1003.002 is the SAM dump, T1003.005 the cached-domain
# credential read the SECURITY hive carries (SYSTEM rides with both as
# the boot key the offline cracking needs); the kernel catalog carries
# the T1003 parent under collect.cred and the matrix renders both
# sub-techniques by id beside it, the same way the run-keys row renders.
# The row is unchanged from the 1.0.0 descriptor-only package; 1.1.0 is
# the tier change that packs the artifact beside it.
[[verbs]]
name = "collect.hives"
version = "1.0.0"
category = "collect"
opsec = { "reads-credential" = true, "writes-to-disk" = true }
techniques = ["T1003.002", "T1003.005"]
output-kind = "text"
output-help = "The readiness rows on list (the backup privilege, each source hive), or one row per dump on save."

  [[verbs.parameters]]
  name = "action"
  label = "Action"
  kind = "enum"
  help = "Empty reports the readiness facts -- a bare task is a read. The save needs an elevated implant."
  choices = ["save", "list"]

  [[verbs.parameters]]
  name = "directory"
  label = "Directory"
  kind = "text"
  help = "The directory the three dumps land in; save only."
  placeholder = "C:\\loot"
  trailing = true

# The one target the artifact set covers: one prebuilt execution half per
# platform and arch the package ships. A Windows artifact row joins when
# a release builds one -- a target without its artifact is a claim the
# package does not carry.
[[compatibility.targets]]
implant-class = "implant"
platform = "linux"
arch = "amd64"

[opsec]
lands-on-disk = true
notes = "Server side, the package lands as descriptor rows and one artifact file under the module store -- no code runs in the teamserver. On the target, the implant half loads from staged task content -- the dumps themselves are the footprint: three on-disk files (sam.hiv, security.hiv, system.hiv) in the task-named directory, carrying account hashes and cached credentials in plain reach of any scanner until the operator pulls and deletes them. The save needs the backup privilege, which is the administrator's to hold; the refusal names elevation rather than pretending the save ran. The verb rides the per-engagement module load -- never a default profile."

[attack]
techniques = ["T1003.002", "T1003.005"]

# The artifact is build output -- build.sh copies the cargo binary into
# plugin/ before a publish; nothing there is committed. The rules admit
# the manifest and the plugin directory only, so the tree's build script
# never rides the package.
[package]
include = ["rod-module.toml", "plugin/**"]

[[plugin.artifacts]]
platform = "linux"
arch = "amd64"
path = "plugin/hives-linux-amd64"
abi = "exec-v1"
