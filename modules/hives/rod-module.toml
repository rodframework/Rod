# The hives module manifest (architecture.md Sec 15.2): the
# credential collection family's first entry rides the same package
# format, canonical form, and signature chain hostenum, domainenum,
# runkeys, services, wmi, and hijack ride, exercised by the CLI's
# end-to-end tests exactly like a template-repository module.

[module]
name = "hives"
version = "1.0.0"
entry = "server"
license = "Apache-2.0"
description = "Account hive dumps: save the SAM, SYSTEM, and SECURITY hives under the backup privilege and report the readiness facts -- collect.hives's execution half lives at src/implant/rust/modules/hives."

[compatibility]
teamserver = "1.0.0"

# The capability requirements (ADR-017): the pair's execution half is a
# plugin the target loads through the module family, so the hosting implant
# must advertise the loader. The implant's handshake advertisement is the
# runtime truth; this row is the store's static filter.
requires = ["plugin-loader/exec-v1", "plugin-loader/native-v1"]

# The verb version matrix (architecture.md Sec 15.2), now the descriptor
# row itself (ADR-018): the verb iterates
# under its own module-scoped version, independently of the package
# version. The row's techniques are the authoritative per-verb ATT&CK
# declaration (ADR-007) -- the ids the descriptor row itself declares
# -- with the module-level [attack] list as their validated
# roll-up. T1003.002 is the SAM dump, T1003.005 the cached-domain
# credential read the SECURITY hive carries (SYSTEM rides with both as
# the boot key the offline cracking needs); the kernel catalog carries
# the T1003 parent under collect.cred and the matrix renders both
# sub-techniques by id beside it, the same way the run-keys row renders.
[[verbs]]
name = "collect.hives"
version = "1.0.0"
category = "collect"
opsec = { "reads-credential" = true, "writes-to-disk" = true }
techniques = ["T1003.002", "T1003.005"]
output-kind = "text"
output-help = "The readiness rows on list (the backup privilege, each source hive), or one row per dump on save."

  [[verbs.parameters]]
  name = "action"
  label = "Action"
  kind = "enum"
  help = "Empty reports the readiness facts -- a bare task is a read. The save needs an elevated implant."
  choices = ["save", "list"]

  [[verbs.parameters]]
  name = "directory"
  label = "Directory"
  kind = "text"
  help = "The directory the three dumps land in; save only."
  placeholder = "C:\\loot"
  trailing = true

# The seat exists only on Windows: the manifest claims the two Windows
# targets and no others, so the module loads nowhere the technique has
# nothing to address.
[[compatibility.targets]]
implant-class = "implant"
platform = "windows"
arch = "amd64"

[[compatibility.targets]]
implant-class = "implant"
platform = "windows"
arch = "arm64"

[opsec]
lands-on-disk = true
notes = "The server-side half is this manifest alone -- no code installs on operator infrastructure. On the target, the implant half loads from staged task content -- the dumps themselves are the footprint: three on-disk files (sam.hiv, security.hiv, system.hiv) in the task-named directory, carrying account hashes and cached credentials in plain reach of any scanner until the operator pulls and deletes them. The save needs the backup privilege, which is the administrator's to hold; the refusal names elevation rather than pretending the save ran. The verb rides the per-engagement module load -- never a default profile."

[attack]
techniques = ["T1003.002", "T1003.005"]

[package]
include = ["rod-module.toml"]
