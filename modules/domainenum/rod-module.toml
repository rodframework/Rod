# The domain-discovery module manifest (architecture.md Sec 15.2,
# ADR-009): the module line's first tradecraft entry rides the same
# package format, canonical form, and signature chain hostenum rides,
# exercised by the CLI's end-to-end tests exactly like a
# template-repository module.

[module]
name = "domainenum"
version = "1.1.0"
entry = "server"
license = "Apache-2.0"
description = "Domain discovery, both halves: local domain posture, DC location (logon server / DNS SRV), and the anonymous LDAP root DSE; and over an authenticated LDAP bind, domain users, groups, ACLs, SPN objects, and trusts -- recon.domainenum's execution half lives at src/implant/rust/modules/domainenum."

[compatibility]
teamserver = "1.0.0"

# The capability requirements (ADR-017): the pair's execution half is a
# plugin the target loads through the module family, so the hosting implant
# must advertise the loader. The implant's handshake advertisement is the
# runtime truth; this row is the store's static filter.
requires = ["plugin-loader/exec-v1", "plugin-loader/native-v1"]

# The verb version matrix (architecture.md Sec 15.2), now the descriptor
# row itself (ADR-018): the verb iterates
# under its own module-scoped version, independently of the package
# version. The row's techniques are the authoritative per-verb ATT&CK
# declaration (ADR-007) -- the ids the descriptor row itself declares
# -- with the module-level [attack] list as their validated
# roll-up. v1.1 widened the row from the credential-free pair to carry
# the authenticated half's account and group discovery techniques.
[[verbs]]
name = "recon.domainenum"
version = "1.1.0"
category = "recon"
opsec = { "touches-network" = true, "writes-to-disk" = false, "uses-credential" = true }
techniques = ["T1018", "T1482", "T1087.002", "T1069.002"]
output-kind = "enumeration"
output-help = "One JSON finding per line: the posture row, then DC rows (host, port, service), the root-DSE row, and -- with a credential -- the directory rows (users, groups, ACLs, SPN objects, trusts)."

  [[verbs.parameters]]
  name = "scope"
  label = "Scope"
  kind = "enum"
  help = "Empty runs the whole sweep the credential affords."
  choices = ["all", "info", "trusts", "spns", "users", "groups", "acls"]

  [[verbs.parameters]]
  name = "user"
  label = "Bind principal"
  kind = "string"
  help = "UPN (jdoe@corp.example.com) or DOMAIN\\jdoe; the authenticated scopes need it."

  [[verbs.parameters]]
  name = "pass"
  label = "Bind secret"
  kind = "string"
  help = "A $cred-<id> placeholder resolves to the stored secret at dispatch."
  trailing = true

# Both delivery shapes run everywhere the seam compiles: the Linux
# executable reads krb5/sssd/resolv and answers over DNS/LDAP, the
# Windows cdylib reads the session environment for the same sweep.
[[compatibility.targets]]
implant-class = "implant"
platform = "linux"
arch = "amd64"

[[compatibility.targets]]
implant-class = "implant"
platform = "linux"
arch = "arm64"

[[compatibility.targets]]
implant-class = "implant"
platform = "windows"
arch = "amd64"

[[compatibility.targets]]
implant-class = "implant"
platform = "windows"
arch = "arm64"

[opsec]
lands-on-disk = true
notes = "The server-side half is this manifest alone -- no code installs on operator infrastructure. On the target, the implant half loads from staged task content: through a memfd on Linux (nothing on disk), mapped in memory on Windows. The sweep sends DNS and LDAP packets to the domain's own servers -- network-visible to the DC. The authenticated scopes bind with the task's credential over simple bind on the cleartext port: the secret crosses the implant-to-DC path in the open unless the site seals it, and a wrong password counts toward the account's lockout."

[attack]
techniques = ["T1018", "T1482", "T1087.002", "T1069.002"]

[package]
include = ["rod-module.toml"]
