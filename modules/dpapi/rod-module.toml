# The dpapi module manifest (architecture.md Sec 15.2): the
# credential collection family's second entry rides the same package
# format, canonical form, and signature chain the seven modules before
# it ride, exercised by the CLI's end-to-end tests exactly like a
# template-repository module.

[module]
name = "dpapi"
version = "1.0.0"
entry = "server"
license = "Apache-2.0"
description = "DPAPI unsealing: unseal the task's base64 blob under the target user's own masterkeys and report the masterkey readiness facts -- collect.dpapi's execution half lives at src/implant/rust/modules/dpapi."

[compatibility]
teamserver = "1.0.0"

# The capability requirements (ADR-017): the pair's execution half is a
# plugin the target loads through the module family, so the hosting implant
# must advertise the loader. The implant's handshake advertisement is the
# runtime truth; this row is the store's static filter.
requires = ["plugin-loader"]

# The verb version matrix (architecture.md Sec 15.2), now the descriptor
# row itself (ADR-018): the verb iterates
# under its own module-scoped version, independently of the package
# version. The row's techniques are the authoritative per-verb ATT&CK
# declaration (ADR-007) -- the ids the descriptor row itself declares
# -- with the module-level [attack] list as their validated
# roll-up. T1555 (Credentials from Password Stores) is the family the
# unsealing primitive serves -- its sub-techniques (the browser stores,
# the credential manager) arrive as their own modules that compose
# against this one's decryption half; the kernel catalog carries the
# T1555 parent under collect.cred and the matrix renders this row
# beside it, the same way the hostenum row renders.
[[verbs]]
name = "collect.dpapi"
version = "1.0.0"
category = "collect"
opsec = { "reads-credential" = true, "writes-to-disk" = false }
techniques = ["T1555"]
output-kind = "text"
output-help = "The masterkey SID rows on list, or the unsealed plaintext as text or base64 by what it is."

  [[verbs.parameters]]
  name = "action"
  label = "Action"
  kind = "enum"
  help = "Empty reports the masterkey readiness facts -- a bare task is a read."
  choices = ["unseal", "list"]

  [[verbs.parameters]]
  name = "blob"
  label = "DPAPI blob"
  kind = "text"
  help = "The base64 DPAPI blob to unseal under the target user's masterkeys; unseal only."
  trailing = true

# The technique exists only on Windows: the manifest claims the two
# Windows targets and no others, so the module loads nowhere the
# primitive has nothing to open.
[[compatibility.targets]]
implant-class = "implant"
platform = "windows"
arch = "amd64"

[[compatibility.targets]]
implant-class = "implant"
platform = "windows"
arch = "arm64"

[opsec]
lands-on-disk = false
notes = "The server-side half is this manifest alone -- no code installs on operator infrastructure. On the target, the implant half loads from staged task content and nothing it does lands on disk: the blob arrives as task text, the plaintext rides back the task's channel into the audit chain. The unseal runs under the masterkeys of the user the implant runs as -- a blob sealed by another user or another machine refuses, and DPAPI itself keeps no operation log. The verb rides the per-engagement module load -- never a default profile."

[attack]
techniques = ["T1555"]

[package]
include = ["rod-module.toml"]
