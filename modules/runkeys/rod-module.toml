# The runkeys module's v4 plugin package (architecture.md Sec 15.2,
# ADR-020): the persistence family's first entry rides the same package
# format, canonical form, and signature chain an external module rides,
# exercised by the CLI's end-to-end tests exactly like a template-
# repository module. The package carries the server-side descriptor rows
# and the Linux exec-shape artifact an implant loads through module.load
# -- build.sh puts the binary at plugin/ before `rod mod publish` packs
# it.

[module]
name = "runkeys"
version = "1.1.0"
entry = "plugin"
license = "Apache-2.0"
description = "Registry run keys: install, remove, and list the Run key seat under HKCU or HKLM -- persist.runkeys's execution half packed as the artifact an implant loads through module.load."

[compatibility]
teamserver = "1.0.0"

# A plugin's requirement rows are exactly its artifacts' ABI union
# (ADR-020): the Linux artifact is the exec shape, so the hosting implant
# must advertise that loader. The implant's handshake advertisement is the
# runtime truth; this row is the store's static filter.
requires = ["plugin-loader/exec-v1"]

# The verb version matrix (architecture.md Sec 15.2), now the descriptor
# row itself (ADR-018): the verb iterates
# under its own module-scoped version, independently of the package
# version. The row's techniques are the authoritative per-verb ATT&CK
# declaration (ADR-007) -- the ids the descriptor row itself declares
# -- with the module-level [attack] list as their validated
# roll-up. T1547.001 is the registry run key seat itself; the kernel
# catalog carries its parent (T1547) and the matrix renders the
# sub-technique by id alone, the same way domainenum's rows render.
# The row is unchanged from the 1.0.0 descriptor-only package; 1.1.0 is
# the tier change that packs the artifact beside it.
[[verbs]]
name = "persist.runkeys"
version = "1.0.0"
category = "persist"
opsec = { "writes-to-disk" = true, "persists" = true }
techniques = ["T1547.001"]
output-kind = "text"
output-help = "One row per seat on list (seat path, name, command), or the seat the install wrote or the remove deleted."

  [[verbs.parameters]]
  name = "action"
  label = "Action"
  kind = "enum"
  help = "Empty lists the seats -- a bare task is a read."
  choices = ["install", "remove", "list"]

  [[verbs.parameters]]
  name = "hive"
  label = "Hive"
  kind = "enum"
  help = "HKCU holds the per-user seat; HKLM the machine-wide one elevation buys."
  choices = ["hkcu", "hklm"]

  [[verbs.parameters]]
  name = "name"
  label = "Value name"
  kind = "string"
  help = "The seat's own name; for list, a filter narrowing the report to it."
  placeholder = "UpdateCheck"

  [[verbs.parameters]]
  name = "command"
  label = "Command"
  kind = "text"
  help = "The command line the seat runs at every logon; install only."
  trailing = true

# The one target the artifact set covers: one prebuilt execution half per
# platform and arch the package ships. A Windows artifact row joins when
# a release builds one -- a target without its artifact is a claim the
# package does not carry.
[[compatibility.targets]]
implant-class = "implant"
platform = "linux"
arch = "amd64"

[opsec]
lands-on-disk = true
notes = "Server side, the package lands as descriptor rows and one artifact file under the module store -- no code runs in the teamserver. On the target, the implant half loads from staged task content, mapped in memory on Windows -- nothing on disk itself. The seat is one registry value: its command line sits in the hive as plain text any blue-team reader sees, and it runs at every interactive logon while it sits. HKCU seats need no elevation; HKLM seats need an elevated implant."

[attack]
techniques = ["T1547.001"]

# The artifact is build output -- build.sh copies the cargo binary into
# plugin/ before a publish; nothing there is committed. The rules admit
# the manifest and the plugin directory only, so the tree's build script
# never rides the package.
[package]
include = ["rod-module.toml", "plugin/**"]

[[plugin.artifacts]]
platform = "linux"
arch = "amd64"
path = "plugin/runkeys-linux-amd64"
abi = "exec-v1"
