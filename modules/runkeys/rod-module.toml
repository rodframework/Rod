# The run-keys module manifest (architecture.md Sec 15.2): the
# persistence family's first entry rides the same package format,
# canonical form, and signature chain hostenum and domainenum ride,
# exercised by the CLI's end-to-end tests exactly like a
# template-repository module.

[module]
name = "runkeys"
version = "1.0.0"
entry = "server"
license = "Apache-2.0"
description = "Registry run keys: install, remove, and list the Run key seat under HKCU or HKLM -- persist.runkeys's execution half lives at src/implant/rust/modules/runkeys."

[compatibility]
teamserver = "1.0.0"

# The capability requirements (ADR-017): the pair's execution half is a
# plugin the target loads through the module family, so the hosting implant
# must advertise the loader. The implant's handshake advertisement is the
# runtime truth; this row is the store's static filter.
requires = ["plugin-loader"]

# The verb version matrix (architecture.md Sec 15.2): the verb iterates
# under its own module-scoped version, independently of the package
# version. The row's techniques are the authoritative per-verb ATT&CK
# declaration (ADR-007) -- the same ids the server-side descriptor
# registers -- with the module-level [attack] list as their validated
# roll-up. T1547.001 is the registry run key seat itself; the kernel
# catalog carries its parent (T1547) and the matrix renders the
# sub-technique by id alone, the same way domainenum's rows render.
[[verbs]]
name = "persist.runkeys"
version = "1.0.0"
techniques = ["T1547.001"]

# The seat exists only on Windows: the manifest claims the two Windows
# targets and no others, so the module loads nowhere the technique has
# nothing to address.
[[compatibility.targets]]
implant-class = "implant"
platform = "windows"
arch = "amd64"

[[compatibility.targets]]
implant-class = "implant"
platform = "windows"
arch = "arm64"

[opsec]
lands-on-disk = true
notes = "Server-side assembly installs on operator infrastructure only. On the target, the implant half loads from staged task content, mapped in memory on Windows -- nothing on disk itself. The seat is one registry value: its command line sits in the hive as plain text any blue-team reader sees, and it runs at every interactive logon while it sits. HKCU seats need no elevation; HKLM seats need an elevated implant."

[attack]
techniques = ["T1547.001"]

[package]
include = ["rod-module.toml", "*.cs", "*.csproj"]
